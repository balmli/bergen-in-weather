<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bergen — Nygård, in weather</title>
<style>
  :root { --fg: #e9e9e9; --dim: #9a9a9a; --bg: rgba(12,12,12,.62); --line: rgba(255,255,255,.16); }
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  #hud { position: fixed; left: 10px; bottom: 10px; font: 10px/1.2 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 6px 8px; display: grid; grid-template-columns: auto 150px auto; gap: 4px 8px; align-items: center; user-select: none; z-index: 5; letter-spacing: .02em; }
  #hud label { color: var(--dim); text-transform: uppercase; font-size: 9px; letter-spacing: .08em; }
  #hud .v { color: var(--fg); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  #hud input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; background: transparent; margin: 0; }
  #hud input[type=range]::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,.35); }
  #hud input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 7px; height: 11px; background: var(--fg); border: 0; margin-top: -5px; border-radius: 0; }
  #hud input[type=range]::-moz-range-track { height: 1px; background: rgba(255,255,255,.35); }
  #hud input[type=range]::-moz-range-thumb { width: 7px; height: 11px; background: var(--fg); border: 0; border-radius: 0; }
  #hud .row { grid-column: 1 / -1; display: flex; gap: 3px; flex-wrap: wrap; }
  #hud button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 2px 6px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-size: 9px; }
  #hud button:hover { border-color: rgba(255,255,255,.55); }
  #hud button.on { background: var(--fg); color: #0c0c0c; border-color: var(--fg); }
  #status { position: fixed; right: 10px; bottom: 10px; font: 9px/1.3 ui-monospace, Menlo, monospace; color: var(--dim); text-align: right; z-index: 5; text-shadow: 0 0 4px #000; pointer-events: none; white-space: pre; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0b0b; color: #cfcfcf; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .12em; z-index: 20; transition: opacity 1.2s; }
  body.noui #hud, body.noui #status { display: none; }
  @media (max-width: 520px) { #hud { left: 6px; right: 6px; grid-template-columns: auto 1fr auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><span id="loadtxt">LOADING BERGEN</span></div>
<div id="hud">
  <label>time</label><input id="time" type="range" min="0" max="24" step="0.01"><span class="v" id="timev"></span>
  <label>rain</label><input id="rain" type="range" min="0" max="1" step="0.01"><span class="v" id="rainv"></span>
  <label>wind</label><input id="wind" type="range" min="0" max="1" step="0.01"><span class="v" id="windv"></span>
  <div class="row" id="presets">
    <button data-p="clear">clear</button><button data-p="overcast">grey</button><button data-p="rain">rain</button><button data-p="storm">storm</button><button data-p="live">live</button>
  </div>
  <div class="row">
    <button id="tour">tour</button><button id="free">fly</button><button id="flow">wind lines</button><button id="tl">time lapse</button><button id="hide">hide ui</button>
  </div>
</div>
<div id="status"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
